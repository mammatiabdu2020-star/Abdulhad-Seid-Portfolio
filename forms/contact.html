    <main class="main">
      <div class="page-title dark-background">
        <div class="container">
          <h1>Contact</h1>
          <p>
            Feel free to reach out for projects, hiring, or technical inquiries.
          </p>
        </div>
      </div>

      <section id="contact" class="contact section py-5">
        <div class="container">
          <div class="row gy-4">
            <div class="col-lg-4">
              <div class="mb-3">
                <i class="bi bi-geo-alt text-primary fs-4 me-2"></i>
                <strong>Location:</strong> Addis Ababa, Ethiopia
              </div>
              <div class="mb-3">
                <i class="bi bi-envelope text-primary fs-4 me-2"></i>
                <strong>Email:</strong> abdulhadi@example.com
              </div>
            </div>
            <div class="col-lg-8">
              <form
                action="forms/contact.php"
                method="post"
                class="p-4 border rounded shadow-sm"
              >
                <div class="row gy-3">
                  <div class="col-md-6">
                    <input
                      type="text"
                      name="name"
                      class="form-control"
                      placeholder="Your Name"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      placeholder="Your Email"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <input
                      type="text"
                      name="subject"
                      class="form-control"
                      placeholder="Subject"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <textarea
                      class="form-control"
                      name="message"
                      rows="5"
                      placeholder="Message"
                      required
                    ></textarea>
                  </div>
                  <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary px-4 py-2">
                      Send Message
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
